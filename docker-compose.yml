# Runs: nginx (load balancer, port 80) -> N copies of the API, plus the Streamlit UI (port 8501).
#   docker compose up -d --build                 start with 1 API container
#   docker compose up -d --scale api=3           run 3 API containers
services:
  api:
    build: .
    image: maize-app
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build: .
    image: maize-app
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://nginx
    ports:
      - "8501:8501"
    healthcheck:
      disable: true   # the image's health check is for the API, not the UI
    depends_on:
      - nginx
    restart: unless-stopped
