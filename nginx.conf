events {}

http {
    # Docker's built-in DNS. Re-checked every 5 s so new API containers are picked up.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        client_max_body_size 200M;   # bulk image uploads

        location / {
            set $api http://api:8000;   # "api" resolves to every API container; nginx rotates between them
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
